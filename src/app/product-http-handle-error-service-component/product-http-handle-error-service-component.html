<h2>Product list with HTTP error handling</h2>

@if (errMessage()) {
  <p class="error-message" role="alert">{{ errMessage() }}</p>
}

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
    </tr>
  </thead>
  <tbody>
    @for (product of products(); track product.id) {
      <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.price }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3">No products available.</td>
      </tr>
    }
  </tbody>
</table>
