<p>product-list-advanced-component works!</p>

<p>{{ errMessage() }}</p>

<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Details</th>
    </tr>
  </thead>
  <tbody>
    @for (p of products(); track p.id) {
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.price }}</td>
        <td>
          <a
            (click)="viewDetail(p.id)"
            style="cursor: pointer;"
            title="Click here to view detail">View Details
          </a>
        </td>
        <td>
            <a (click)="viewDetailSlug(p)"
        style="cursor: pointer;"
        title="click here to view detail" >
        {{generateSlug(p.name,p.id)}}
        </a>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">No products available.</td>
      </tr>
    }
  </tbody>
</table>
